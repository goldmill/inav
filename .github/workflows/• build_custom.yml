name: Build Custom HW F7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Build firmware
        run: |
          mkdir -p build
          cd build
          cmake -GNinja ..
          ninja HW_F7_CUSTOM

      - name: Upload HEX file
        uses: actions/upload-artifact@v4
        with:
          name: HW_F7_CUSTOM-firmware
          path: build/bin/*.hex
